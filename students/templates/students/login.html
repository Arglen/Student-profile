<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — Enrollment System</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0f2f8; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .login-box { background: #fff; border-radius: 14px; box-shadow: 0 4px 24px rgba(0,0,0,.1); padding: 44px 40px; width: 100%; max-width: 380px; }
    .login-logo { text-align: center; font-size: 2rem; margin-bottom: 8px; }
    .login-title { text-align: center; font-size: 1.25rem; font-weight: 700; margin-bottom: 4px; }
    .login-sub { text-align: center; font-size: .82rem; color: #888; margin-bottom: 28px; }
    label { font-size: .78rem; font-weight: 600; color: #555; display: block; margin-bottom: 5px; }
    input[type=text], input[type=password] {
      width: 100%; padding: 10px 14px; border: 1px solid #dde; border-radius: 8px;
      font-size: .9rem; outline: none; margin-bottom: 16px; background: #f7f8fc;
    }
    input:focus { border-color: #3b5fc0; background: #fff; }
    .btn-login {
      width: 100%; padding: 12px; background: #3b5fc0; color: #fff;
      border: none; border-radius: 8px; font-size: .95rem; font-weight: 700; cursor: pointer; margin-top: 4px;
    }
    .btn-login:hover { background: #2c4faa; }
    .error { background: #fce4ec; color: #c62828; border-radius: 7px; padding: 10px 14px; font-size: .82rem; margin-bottom: 16px; }
  </style>
</head>
<body>
<div class="login-box">
  <div class="login-logo">🎓</div>
  <div class="login-title">Enrollment System</div>
  <div class="login-sub">Sign in to continue</div>
  {% if form.errors %}
  <div class="error">Invalid username or password.</div>
  {% endif %}
  <form method="post">
    {% csrf_token %}
    <label for="id_username">Username</label>
    <input type="text" id="id_username" name="username" autofocus required>
    <label for="id_password">Password</label>
    <input type="password" id="id_password" name="password" required>
    <input type="hidden" name="next" value="{{ next }}">
    <button class="btn-login" type="submit">Log in</button>
  </form>
</div>
</body>
</html>
