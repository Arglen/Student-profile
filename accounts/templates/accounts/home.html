{% extends "accounts/base.html" %}
{% block title %}Home — borrowhood{% endblock %}

{% block content %}
<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:60px 40px;text-align:center;">
  <h1 style="font-size:2.4rem;font-weight:700;letter-spacing:-1px;">
    Welcome{% if user.first_name %}, {{ user.first_name }}{% endif %}.
  </h1>
  <p style="color:#666;font-size:1rem;">You're part of the neighborhood now.</p>
  <a href="{% url 'logout' %}" style="margin-top:12px;font-size:0.9rem;color:#111;font-weight:600;text-decoration:none;border-bottom:1px solid #111;">Log out</a>
</div>
{% endblock %}
